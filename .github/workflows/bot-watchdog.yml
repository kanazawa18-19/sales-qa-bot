name: Sales QA Bot 停止確認
run-name: ${{ inputs.clock_request_id && format('GAS停止確認 {0}', inputs.clock_request_id) || 'Sales QA Bot 停止確認' }}

on:
  schedule:
    - cron: '47 */4 * * *'  # GAS停止時の復旧保険
  workflow_dispatch:
    inputs:
      clock_request_id:
        description: GAS時計の照合ID
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: sales-qa-bot-watchdog
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 未完了Botがない場合だけ復旧を要求
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const recover = require('./scripts/bot_watchdog.cjs');
            await recover({github, context, core});
