name: Sales QA Bot

run-name: ${{ inputs.clock_request_id && format('GAS本人DM {0}', inputs.clock_request_id) || 'Sales QA Bot' }}

on:
  workflow_dispatch:
    inputs:
      clock_request_id:
        description: GAS単発試験の照合ID
        type: string
        default: ""
      owner_http_smoke:
        description: 本人DMでHTTP受信とNotebookLMの通し検証
        type: boolean
        default: false
      owner_dm_smoke:
        description: 本人DMでNotebookLMの実回答を1回だけ確認
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/runtime_ops.py'
      - '.github/workflows/bot.yml'

permissions:
  contents: read
  actions: write  # 自己再起動のために必要

concurrency:
  group: ${{ inputs.owner_http_smoke && 'sales-qa-http-smoke' || inputs.owner_dm_smoke && 'sales-qa-owner-dm-smoke' || github.ref == 'refs/heads/main' && 'sales-qa-bot' || format('sales-qa-nonmain-{0}', github.run_id) }}
  # 自己再起動・復旧・pushが重なっても稼働中Botは止めない。
  cancel-in-progress: false

jobs:
  run-bot:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.owner_dm_smoke && !inputs.owner_http_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        timeout-minutes: 27
        run: python scripts/runtime_ops.py supervise
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          AUTH_CLOCK_OWNER: ${{ vars.AUTH_CLOCK_OWNER || 'bot' }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          QA_CHANNEL_ID: ${{ secrets.QA_CHANNEL_ID }}
          QA_CAPTURE_ENABLED: ${{ vars.QA_CAPTURE_ENABLED || 'true' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERVICE_MATERIALS_TEXT: ${{ secrets.SERVICE_MATERIALS_TEXT }}
          NOTEBOOKLM_NOTEBOOK_ID: ff4df3ed-ae9a-4684-a8d1-8b00a8833ba0
          NOTEBOOKLM_STORAGE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_JSON }}
          AI_CHANNEL_ID: ${{ secrets.AI_CHANNEL_ID }}

      - name: Restart workflow
        id: restart
        if: ${{ !cancelled() }}
        run: |
          curl --fail --silent --show-error --max-time 25 -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: 再起動失敗を本人へ通知
        if: ${{ failure() && steps.restart.outcome == 'failure' }}
        run: python scripts/runtime_ops.py restart-failed
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  owner-dm-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_dm_smoke && !inputs.owner_http_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: NotebookLM実回答を本人DMへ送信
        run: python scripts/owner_dm_smoke.py
        env:
          CLOCK_REQUEST_ID: ${{ inputs.clock_request_id }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTEBOOKLM_STORAGE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_JSON }}
          NOTEBOOKLM_NOTEBOOK_ID: ff4df3ed-ae9a-4684-a8d1-8b00a8833ba0

  owner-http-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_http_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-http.txt
      - name: 署名付きHTTP受信から本人DMへの返信を確認
        run: python scripts/owner_http_smoke.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTEBOOKLM_STORAGE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_JSON }}
          NOTEBOOKLM_NOTEBOOK_ID: ff4df3ed-ae9a-4684-a8d1-8b00a8833ba0
