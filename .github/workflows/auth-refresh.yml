name: Refresh NotebookLM Auth

on:
  schedule:
    - cron: '*/5 * * * *'  # 5分ごと
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install notebooklm-py
        run: pip install notebooklm-py

      - name: Write storage JSON
        env:
          STORAGE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_JSON }}
        run: |
          mkdir -p /home/runner/.notebooklm/profiles/default
          echo "$STORAGE_JSON" > /home/runner/.notebooklm/profiles/default/storage_state.json

      - name: Refresh auth
        run: python -m notebooklm auth refresh

      - name: Update NOTEBOOKLM_STORAGE_JSON secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set NOTEBOOKLM_STORAGE_JSON \
            --repo "${{ github.repository }}" \
            < /home/runner/.notebooklm/profiles/default/storage_state.json
