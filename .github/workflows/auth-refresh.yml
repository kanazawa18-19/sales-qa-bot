name: Refresh NotebookLM Auth

run-name: ${{ inputs.clock_request_id && format('GAS認証更新 {0}', inputs.clock_request_id) || 'Refresh NotebookLM Auth' }}

on:
  schedule:
    - cron: '17,47 * * * *'  # Botからの5分起動が途切れた場合の保険
  workflow_dispatch:
    inputs:
      clock_request_id:
        description: GAS時計の照合ID
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: sales-qa-notebooklm-auth-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebooklm-py
        run: pip install notebooklm-py==0.8.3 requests==2.32.3
      - name: 認証更新・保存・到達確認
        run: python scripts/runtime_ops.py refresh
        env:
          NOTEBOOKLM_STORAGE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_JSON }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
